[package]
name = "taskora-mobile"
version = "0.4.6"
description = "Taskora Android client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "taskora_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tauri-plugin-notification = "2"

# 通知设置页跳转（Reminders spec）：经 tao 初始化的 ndk-context 拿
# Application Context，JNI 发 APP_NOTIFICATION_SETTINGS intent。
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
