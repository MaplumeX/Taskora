[package]
name = "taskora-mobile"
version = "0.4.4"
description = "Taskora Android client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "taskora_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
tempfile = "3"

# Android Keystore 桥接（ADR-0009）：JNI 调用 Android Keystore 的
# 不可导出 AES 密钥加密会话令牌。非 Android 目标（本地 cargo check）
# 不编译 JNI 路径。
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
