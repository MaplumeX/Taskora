[package]
name = "tauri-plugin-background"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Taskora Android activity control: move the app task to the background (back to home) instead of exiting the process (android-app issue 08), and expose the system bar safe-area insets"
license = "MIT"
links = "tauri-plugin-background"

# Android 构建产物（tauri_plugin::Builder 会把 tauri-api 复制进
# android/.tauri）不入包。
exclude = ["android/build/", "android/.gradle/", "android/.tauri/", "target/"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
