"$schema" = "schemas/schema.json"

[default]
description = "Allows moving the app task to the background (back to home) instead of exiting the process, reading / subscribing to system theme and system bar safe-area insets, and matching the system bar icon appearance to the app theme."
permissions = [
  "allow-move-to-back",
  "allow-safe-area-insets",
  "allow-set-system-bar-appearance",
  "allow-system-theme",
  "allow-register-listener",
  "allow-remove-listener",
]
