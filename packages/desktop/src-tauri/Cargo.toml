[package]
name = "taskora-desktop"
version = "1.0.5"
description = "Taskora desktop client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "taskora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
# 自动更新（ADR-0026）：目标版本由所连 hub 决定，endpoint 在运行时拼出。
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["sync-secret-service", "apple-native", "windows-native"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
winreg = "0.55"
# Reminder 通知（reminder-actions spec）：直接用 WinRT toast API，以获得按钮、
# 点击回调与按 tag 撤回。版本与 tauri-plugin-notification 依赖树中的一致。
windows = { version = "0.61", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
notify-rust = "4"
# 撤回 reminder 通知（CloseNotification）：notify-rust 的句柄被等待按钮的线程占用。
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
