server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 不做强缓存：文件名不带 hash，缓存住会让浏览器继续引用
    # 已被新构建删除的旧 assets，懒加载时报 404
    # （`Failed to fetch dynamically imported module`）。no-cache 仍带
    # ETag 校验，没变时走 304。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 静态资源长期缓存（Vite 产物文件名带 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API reverse proxy — preserve original URI (including /api/v1 prefix)
    location /api/ {
        # 与后端 JSON 上限（main.ts）对齐：/sync/push 承载离线积压的 Outbox
        client_max_body_size 4m;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
