packages:
  - 'packages/*'
allowBuilds:
  '@google/genai': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': false
  esbuild: true
  prisma: true
  protobufjs: true
overrides:
  typescript: 5.9.3
pnpm:
  onlyBuiltDependencies:
    - '@google/genai'
    - '@prisma/client'
    - '@prisma/engines'
    - bcryptjs
    - esbuild
    - prisma
