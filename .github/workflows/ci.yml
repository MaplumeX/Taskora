name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck/test 前置依赖：shared/engine 的 dist 和 prisma client 生成产物
      - run: pnpm --filter @taskora/shared build
      - run: pnpm --filter @taskora/engine build
      - run: pnpm --filter @taskora/backend exec prisma generate

      - run: pnpm typecheck

      - run: pnpm test

      # 验证镜像可构建（不推送）
      - name: Build backend image
        run: docker build -f packages/backend/Dockerfile -t taskora-backend:ci .

      - name: Build frontend image
        run: docker build -f packages/frontend/Dockerfile -t taskora-frontend:ci .

  # Linux 编译检查；Windows 会话测试验证真实 DPAPI。三平台安装包仍由
  # v* tag 的 desktop-release.yml 构建。
  desktop-rust-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: cargo check
        working-directory: packages/desktop/src-tauri
        run: cargo check --locked

  desktop-windows-session-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Test DPAPI session persistence and migration
        working-directory: packages/desktop/src-tauri
        run: 'cargo test --locked --lib session::'

  # mobile Rust 编译检查（Linux）：host 目标验证 sqlite/session 模块；
  # Android 目标交叉编译验证（rusqlite bundled sqlite 需要 NDK clang，
  # cargo check 不链接但 cc crate 需显式 CC/AR/LINKER）。与
  # desktop-rust-check 同模式。
  mobile-rust-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # ubuntu runner 预装 Android SDK（ANDROID_HOME + cmdline-tools）。
      # 不用 setup-android@v3：它的默认包 'tools' 已从 SDK 仓库移除（
      # Failed to find package 'tools'）。预装的 sdkmanager 需要 JDK 17+
      # （runner 默认 JDK 11），先装 JDK 再用 sdkmanager 装 NDK。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.0.13004108" --sdk_root="$ANDROID_HOME"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/mobile/src-tauri

      - name: cargo check (host)
        working-directory: packages/mobile/src-tauri
        run: cargo check --locked

      # 交叉编译检查：需指向 NDK 的 clang（bundled sqlite 的 cc crate 不会
      # 自动发现 NDK，须显式 CC/AR/LINKER）。
      - name: cargo check (Android target)
        working-directory: packages/mobile/src-tauri
        run: |
          NDK_BIN=$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang
          export AR_aarch64_linux_android=$NDK_BIN/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android24-clang
          cargo check --locked --target aarch64-linux-android

      - name: cargo test
        working-directory: packages/mobile/src-tauri
        run: cargo test --locked --lib
