name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck/test 前置依赖：shared 的 .d.ts 和 prisma client 生成产物
      - run: pnpm --filter @taskora/shared build
      - run: pnpm --filter @taskora/backend exec prisma generate

      - run: pnpm typecheck

      - run: pnpm test

      # 验证镜像可构建（不推送）
      - name: Build backend image
        run: docker build -f packages/backend/Dockerfile -t taskora-backend:ci .

      - name: Build frontend image
        run: docker build -f packages/frontend/Dockerfile -t taskora-frontend:ci .

  # Linux 编译检查；Windows 会话测试验证真实 DPAPI。三平台安装包仍由
  # desktop-v* tag 的 desktop-release.yml 构建。
  desktop-rust-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: cargo check
        working-directory: packages/desktop/src-tauri
        run: cargo check --locked

  desktop-windows-session-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Test DPAPI session persistence and migration
        working-directory: packages/desktop/src-tauri
        run: 'cargo test --locked --lib session::'
