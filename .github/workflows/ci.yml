name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck/test 前置依赖：shared 的 .d.ts 和 prisma client 生成产物
      - run: pnpm --filter @taskora/shared build
      - run: pnpm --filter @taskora/backend exec prisma generate

      - run: pnpm typecheck

      - run: pnpm test

      # 验证镜像可构建（不推送）
      - name: Build backend image
        run: docker build -f packages/backend/Dockerfile -t taskora-backend:ci .

      - name: Build frontend image
        run: docker build -f packages/frontend/Dockerfile -t taskora-frontend:ci .
