name: Android Release

# Android APK 签名构建 + GitHub Releases 侧载分发（android-app issue 06）。
# tag 触发，与 desktop-release.yml 同一套 v* tag；密钥经 secrets 注入，
# 签名密钥不轮换（轮换会迫使所有用户卸载重装、丢失 Local Replica）。
#
# 所需 secrets（且仅此四个，不含源码内文件）：
#   ANDROID_KEYSTORE_BASE64    release keystore（base64 编码的 .jks）
#   ANDROID_KEYSTORE_PASSWORD  keystore 密码
#   ANDROID_KEY_PASSWORD       密钥条目密码
#   ANDROID_KEY_ALIAS          密钥别名

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu runner 预装 Android SDK（ANDROID_HOME + cmdline-tools）。
      # 不用 setup-android@v3：其默认包 'tools' 已从 SDK 仓库移除
      # （Failed to find package 'tools'）；直接用预装 sdkmanager 装 NDK
      # （上面 setup-java 提供它需要的 JDK 17+）。
      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.0.13004108" --sdk_root="$ANDROID_HOME"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/mobile/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # shared DTOs are consumed from source; build its .d.ts for tsc
      - run: pnpm --filter @taskora/shared build

      # gen/android 不入库，构建时生成（tauri.conf.json + icons 为权威源）。
      - name: Generate Android project
        run: pnpm --filter @taskora/mobile exec tauri android init --ci

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/taskora-release.jks

      # Tauri CLI 不读 TAURI_ANDROID_* 环境变量——官方签名方式是往
      # gen/android 写 keystore.properties 并给 app/build.gradle.kts 注入
      # signingConfigs（https://v2.tauri.app/distribute/sign/android/）。
      # gen/ 是构建时生成的，注入必须每次构建后重新做。
      - name: Configure signing (keystore.properties + gradle signingConfigs)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PATH: ${{ runner.temp }}/taskora-release.jks
        run: |
          cd packages/mobile/src-tauri/gen/android
          python3 - <<'PY'
          import os
          props = {
              'keyAlias': os.environ['ANDROID_KEY_ALIAS'],
              'keyPassword': os.environ['ANDROID_KEY_PASSWORD'],
              'storePassword': os.environ['ANDROID_KEYSTORE_PASSWORD'],
              'storeFile': os.environ['KEYSTORE_PATH'],
          }
          with open('keystore.properties', 'w', encoding='utf8', newline='\n') as f:
              f.write(''.join(f'{k}={v}\n' for k, v in props.items()))

          path = 'app/build.gradle.kts'
          src = open(path, encoding='utf8').read()
          src = src.replace(
              'import java.util.Properties\n',
              'import java.util.Properties\nimport java.io.FileInputStream\n',
              1,
          )
          signing = '''    signingConfigs {
          create("release") {
              val keystorePropertiesFile = rootProject.file("keystore.properties")
              val keystoreProperties = Properties()
              if (keystorePropertiesFile.exists()) {
                  keystoreProperties.load(FileInputStream(keystorePropertiesFile))
              }
              keyAlias = keystoreProperties["keyAlias"] as String
              keyPassword = keystoreProperties["keyPassword"] as String
              storeFile = file(keystoreProperties["storeFile"] as String)
              storePassword = keystoreProperties["storePassword"] as String
          }
      }
      buildTypes {
  '''
          assert '    buildTypes {\n' in src
          src = src.replace('    buildTypes {\n', signing, 1)
          old = '''        getByName("release") {
              isMinifyEnabled = true'''
          new = '''        getByName("release") {
              signingConfig = signingConfigs.getByName("release")
              isMinifyEnabled = true'''
          assert old in src
          src = src.replace(old, new, 1)
          open(path, 'w', encoding='utf8', newline='\n').write(src)

          # 系统栏避让（真机反馈：状态栏遮挡顶栏）：模板 MainActivity 的
          # enableEdgeToEdge 后 WebView 不保证报告 safe-area-inset-*（取值
          # 0 时顶栏被状态栏遮挡），在原生层消费 insets 给内容视图加
          # padding。gen 不入库，每次构建后重写该文件。
          main_activity = '''package app.taskora.mobile

import android.content.res.Configuration
import android.os.Bundle
import android.view.ViewGroup
import androidx.activity.enableEdgeToEdge
import androidx.core.view.ViewCompat
import androidx.core.view.WindowCompat
import androidx.core.view.WindowInsetsCompat
import androidx.core.view.WindowInsetsControllerCompat

class MainActivity : TauriActivity() {
  override fun onCreate(savedInstanceState: Bundle?) {
    enableEdgeToEdge()
    super.onCreate(savedInstanceState)

    // 系统栏避让：Android WebView 不保证报告 safe-area-inset-*（取值 0
    // 时页面顶栏被状态栏遮挡、底栏被导航栏遮挡），在原生层消费 insets
    // 给内容视图加 padding，WebView 整体布局在系统栏之间。
    val content = findViewById<ViewGroup>(android.R.id.content)
    ViewCompat.setOnApplyWindowInsetsListener(content) { view, insets ->
      val bars = insets.getInsets(
        WindowInsetsCompat.Type.systemBars() or WindowInsetsCompat.Type.displayCutout()
      )
      view.setPadding(bars.left, bars.top, bars.right, bars.bottom)
      insets
    }

    applySystemBarColors()
  }

  // 状态栏/导航栏 strip 背景 = App 主题背景色（ui/src/index.css 的
  // --background）：亮色 hsl(40 33% 97%)，暗色 hsl(270 14% 9%)。
  // 跟随系统 DayNight；manifest 的 configChanges 含 uiMode，主题切换
  // 不重建 Activity，靠 onConfigurationChanged 重刷。
  // 已知取舍：App 内手动指定主题（非 system）时 strip 仍按系统主题着色。
  private fun applySystemBarColors() {
    val night =
      (resources.configuration.uiMode and Configuration.UI_MODE_NIGHT_MASK) ==
        Configuration.UI_MODE_NIGHT_YES
    val background = if (night) 0xFF14171A.toInt() else 0xFFFAF8F5.toInt()

    val content = findViewById<ViewGroup>(android.R.id.content)
    content.setBackgroundColor(background)

    // strip 由我们着色，系统栏图标的明暗需显式匹配（浅底用深色图标）。
    WindowCompat.getInsetsController(window, content).apply {
      isAppearanceLightStatusBars = !night
      isAppearanceLightNavigationBars = !night
    }
  }

  override fun onConfigurationChanged(newConfig: Configuration) {
    super.onConfigurationChanged(newConfig)
    applySystemBarColors()
  }
}
'''
          open(
              'app/src/main/java/app/taskora/mobile/MainActivity.kt',
              'w',
              encoding='utf8',
              newline='\n',
          ).write(main_activity)
          PY

      - name: Build signed APK
        # 全 ABI universal APK：单个安装包覆盖任何 64/32 位设备，侧载
        # 分发不需要按架构选包。
        run: pnpm --filter @taskora/mobile exec tauri android build --apk

      - name: Attach APK to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find packages/mobile/src-tauri/gen/android/app/build/outputs/apk \
            -name 'app-universal-release.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "universal release APK not found" >&2
            find packages/mobile/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' >&2 || true
            exit 1
          fi
          # release 本体由 desktop-release.yml 的 tauri-action 创建，两个
          # workflow 无顺序保证：先确保 release 存在（已存在则跳过），再上
          # 传附件，避免 Android 先构建完时 upload 报 release not found。
          gh release create "${{ github.ref_name }}" \
            --title "Taskora ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag || true
          gh release upload "${{ github.ref_name }}" "$APK" "#Taskora-${{ github.ref_name }}.apk" --clobber
