name: Android Release

# Android APK 签名构建 + GitHub Releases 侧载分发（android-app issue 06）。
# tag 触发，与 desktop-release.yml 同一套 v* tag；密钥经 secrets 注入，
# 签名密钥不轮换（轮换会迫使所有用户卸载重装、丢失 Local Replica）。
#
# 所需 secrets（且仅此四个，不含源码内文件）：
#   ANDROID_KEYSTORE_BASE64    release keystore（base64 编码的 .jks）
#   ANDROID_KEYSTORE_PASSWORD  keystore 密码
#   ANDROID_KEY_PASSWORD       密钥条目密码
#   ANDROID_KEY_ALIAS          密钥别名

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release missing its APK (e.g. v0.8.0); build the selected main commit'
        required: true
        type: string

# 同一版本不能同时补发；不取消正在签名/上传的任务。
concurrency:
  group: android-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 补发用 main 上的修复提交，不重写旧 tag；只允许同版本且尚无 APK
      # 的现有 Release。输入经 env 传入，避免插入 shell 源码。
      - name: Validate release target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const tag = process.env.RELEASE_TAG;
          assert.match(tag, /^v\d+\.\d+\.\d+(-[\w.]+)?$/);
          const conf = 'packages/mobile/src-tauri/tauri.conf.json';
          for (const file of ['package.json', 'packages/mobile/package.json', conf]) {
            assert.equal(`v${JSON.parse(readFileSync(file, 'utf8')).version}`, tag, `${file} version mismatch`);
          }
          const cargo = readFileSync('packages/mobile/src-tauri/Cargo.toml', 'utf8');
          assert.equal(`v${/^version\s*=\s*"(.+)"$/m.exec(cargo)?.[1]}`, tag, 'Cargo version mismatch');
          const tagRef = `refs/tags/${tag}`;
          execFileSync('git', ['merge-base', '--is-ancestor', tagRef, 'HEAD']);
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            assert.equal(process.env.GITHUB_REF, 'refs/heads/main', 'Recovery must run on main');
            const original = JSON.parse(execFileSync('git', ['show', `${tagRef}:${conf}`], { encoding: 'utf8' }));
            assert.equal(`v${original.version}`, tag, 'Original tag version mismatch');
            const release = JSON.parse(execFileSync('gh', ['release', 'view', tag, '--json', 'assets,isDraft'], { encoding: 'utf8' }));
            assert.equal(release.isDraft, false, 'Recovery requires a published release');
            assert(!release.assets.some(asset => asset.name.endsWith('.apk')), 'Release already has an APK; refusing replacement');
          }
          NODE

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu runner 预装 Android SDK（ANDROID_HOME + cmdline-tools）。
      # 不用 setup-android@v3：其默认包 'tools' 已从 SDK 仓库移除
      # （Failed to find package 'tools'）；直接用预装 sdkmanager 装 NDK
      # （上面 setup-java 提供它需要的 JDK 17+）。
      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.0.13004108" --sdk_root="$ANDROID_HOME"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/mobile/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # shared DTOs are consumed from source; build its .d.ts for tsc
      - run: pnpm --filter @taskora/shared build

      # gen/android 不入库，构建时生成（tauri.conf.json + icons 为权威源）。
      - name: Generate Android project
        run: pnpm --filter @taskora/mobile exec tauri android init --ci

      - name: Install Taskora Android launcher icons
        run: node scripts/sync-android-icons.mjs

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/taskora-release.jks

      # 签名 + MainActivity 注入逻辑在 scripts/android-signing.py（仓库内真
      # 实文件）：Tauri CLI 不读 TAURI_ANDROID_* 环境变量，官方方式是写
      # gen/android/keystore.properties 并给 app/build.gradle.kts 注入
      # signingConfigs（https://v2.tauri.app/distribute/sign/android/）；
      # edge-to-edge 的 MainActivity 也要重写（gen/ 不入库）。嵌套
      # heredoc 会因浅缩进文本破坏 run: | 块，故用脚本文件。
      - name: Configure signing and MainActivity (scripts/android-signing.py)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PATH: ${{ runner.temp }}/taskora-release.jks
        run: python3 scripts/android-signing.py packages/mobile/src-tauri/gen/android

      - name: Build signed APK
        # 仅 arm64（arm64-v8a）：2019 年后的安卓手机全部是 arm64
        # （Play 商店同期起强制 64 位）；x86 只有模拟器用，armeabi-v7a
        # 仅覆盖 2018 年前的老机型。单架构构建省 3/4 的 Rust 交叉编译
        # 时间与 APK 体积。发 ABI 需求变化时去掉 --target 即回到 universal。
        run: pnpm --filter @taskora/mobile exec tauri android build --apk --target aarch64

      - name: Attach APK to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --target aarch64 的产物仍在 universal/ 目录（Tauri 的 target
          # 参数只影响编译目标，不改产物路径），按名称兜底两种布局。
          APK=$(find packages/mobile/src-tauri/gen/android/app/build/outputs/apk \
            \( -name 'app-universal-release.apk' -o -name 'app-aarch64-release.apk' \) | head -n1)
          if [ -z "$APK" ]; then
            echo "release APK not found" >&2
            find packages/mobile/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' >&2 || true
            exit 1
          fi
          # release 本体由 desktop-release.yml 的 tauri-action 创建，两个
          # workflow 无顺序保证：先确保 release 存在（已存在则跳过），再上
          # 传附件，避免 Android 先构建完时 upload 报 release not found。
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
              gh release create "$RELEASE_TAG" \
                --title "Taskora $RELEASE_TAG" --generate-notes --verify-tag
          fi
          # 记录真实构建提交：补发 APK 来自修复提交，而不是未移动的旧 tag。
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const tag = process.env.RELEASE_TAG;
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          writeFileSync(`Taskora-${tag}-android-build.json`, JSON.stringify({
            releaseTag: tag,
            tagCommit: git('rev-parse', `refs/tags/${tag}^{commit}`),
            sourceCommit: git('rev-parse', 'HEAD'),
            workflowRun: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }, null, 2) + '\n');
          NODE
          # 手动补发禁止覆盖已存在 APK（即使构建期间有人上传也会失败）。
          cp "$APK" "Taskora-${RELEASE_TAG}.apk"
          UPLOAD_ARGS=()
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            UPLOAD_ARGS+=(--clobber)
          fi
          gh release upload "$RELEASE_TAG" "Taskora-${RELEASE_TAG}.apk" \
            "Taskora-${RELEASE_TAG}-android-build.json" "${UPLOAD_ARGS[@]}"
          echo "Published Taskora-${RELEASE_TAG}.apk from commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
