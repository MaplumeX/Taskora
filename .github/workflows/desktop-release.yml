name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the primary platform — keep it on the oldest supported
          # runner for glibc compatibility of the AppImage.
          - platform: ubuntu-22.04
            args: '--bundles appimage'
          - platform: macos-latest
            # app 生成 updater 的 .app.tar.gz 与 .sig；dmg 用于手动安装。
            args: '--bundles app,dmg'
          - platform: windows-latest
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Linux system deps for Tauri (webkit2gtk etc.)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # shared DTOs are consumed from source; build its .d.ts for tsc
      - run: pnpm --filter @taskora/shared build

      - name: Test native session storage
        run: 'cargo test --locked --lib --manifest-path packages/desktop/src-tauri/Cargo.toml session::'

      # 自动更新（ADR-0026）：createUpdaterArtifacts 为更新包生成 .sig，
      # macOS 使用 app 的 .app.tar.gz，Linux / Windows 复用安装包。
      # tauri-action 把三平台合并进本 tag 的 latest.json。客户端按所连 hub
      # 的版本取 releases/download/v<hub>/latest.json，不追 latest。私钥只在
      # secrets 中（另有离线备份）；丢失后已安装的客户端再也收不到更新。
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tagName: ${{ github.ref_name }}
          # 三端共用同一个 v* Release：标题必须与 android-release.yml 的
          # `gh release create --title` 一致，否则谁先跑谁定标题。
          releaseName: 'Taskora ${{ github.ref_name }}'
          releaseBody: 'Taskora ${{ github.ref_name }} — desktop installers (dmg / NSIS exe / AppImage) for this tag, plus the signed Android APK attached by android-release.yml. The desktop builds are unsigned — see the README for Gatekeeper / SmartScreen instructions.'
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
